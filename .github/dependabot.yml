version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router"]
      mui:
        patterns: ["@mui/*", "@emotion/*"]
      lint-and-test:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "vitest", "@vitest/*", "@testing-library/*", "jsdom", "prettier"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
